    <div id="top-bar" class="top-bar">

      <button onclick="playTheme()" id="playBtn" class="subheading-font" >

        </button>
  




    </div>











    <div id="welcome" class="draggable-window welcome">

      </div>

      <h1 class="pokemon-font">pokéOS</h1>
      <p class="text-font"><dfn>pokéOS</dfn> is a simple operating system for <strong>Pokémon</strong>.</p>
